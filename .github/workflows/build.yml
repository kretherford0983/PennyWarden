# Builds installable packages whenever code lands in a long-lived branch:
#   develop -> packages attached to the workflow run (artifacts, kept 14 days)
#   test    -> GitHub pre-release  v<version>-test.<run number>   (install on the test server)
#   main    -> GitHub release      v<version>  (+ git tag)          (install in production)
# A release is created only once per version: if tag v<version> already exists the main build is packaged but not
# re-released (pull requests into main are blocked earlier by scripts/check_promotion.sh when the version was not bumped).
# v1.5.0: the one-file Windows .exe is built and smoke-tested (with the portable zip) on a Windows runner (CR-026);
# install.sh (one-command Linux install, CR-027) is attached to every release. Run this workflow by hand
# (Actions -> build -> Run workflow) on a feature branch to try the packages without publishing anything.
# 1.6.7: PennyWarden.app for Macs with Apple Silicon is built, ad hoc signed and smoke-tested on a macOS arm64 runner
# and attached as PennyWarden-<version>-macos-arm64.dmg.
name: build
on:
  push:
    branches: [develop, test, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # 2.3.0 (#420): code reaches develop/test/main only through a pull request whose CI ran the full suite on the
  # up-to-date branch (ruleset: required checks + "require branches to be up to date"), so a push build does not run
  # it again. A hand-run build (Actions -> build -> Run workflow, e.g. on a feature branch) still tests first.
  # Every later job uses !failure() && !cancelled() so a skipped tests job doesn't skip packaging.
  tests:
    if: github.event_name == 'workflow_dispatch'
    uses: ./.github/workflows/tests.yml
    with:
      # 1.8.0 (#98): develop may carry a merged Dependabot update until the notices are regenerated there;
      # test and main stay strict
      notices: ${{ github.ref_name == 'develop' && 'regenerate' || 'check' }}

  package:
    needs: tests
    if: ${{ !failure() && !cancelled() }}
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    outputs:
      version: ${{ steps.meta.outputs.version }}
      artifact: ${{ steps.meta.outputs.artifact }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - id: meta
        name: Version
        run: |
          V="$(bash scripts/version.sh)"
          echo "version=$V" >> "$GITHUB_OUTPUT"
          # artifact names may not contain "/" (manual runs on feature/... branches)
          echo "artifact=PennyWarden-$V-${GITHUB_REF_NAME//\//-}-$GITHUB_RUN_NUMBER" >> "$GITHUB_OUTPUT"
      - name: Build info shown in the app (My Account / System About)
        env:
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          printf '{"version":"%s","branch":"%s","commit":"%s","run":"%s","built_at":"%s"}\n' \
            "$VERSION" "$GITHUB_REF_NAME" "${GITHUB_SHA::7}" "$GITHUB_RUN_NUMBER" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            > backend/fmpoc/build_info.json
      - name: Frontend production build
        run: npm --prefix frontend ci && npm --prefix frontend run build
      - name: Linux portable package (servers - use with packaging/linux/install-server.sh)
        run: bash packaging/build_linux_portable.sh
      - name: Windows portable package
        run: bash packaging/build_windows_portable.sh
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - name: Demo backup (2.2.0, #243 - synthetic data, published passphrase; the Try the demo page links to it)
        env:
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          pip install -r backend/requirements-dev.txt
          python scripts/build_demo.py --out "dist/pennywarden-demo-$VERSION.fmbak"
      - name: Assemble release files
        env:
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          mkdir -p release
          cp dist/PennyWarden-linux-x64-portable.tar.gz dist/PennyWarden-windows-x64.zip release/
          cp "dist/pennywarden-demo-$VERSION.fmbak" release/                     # 2.2.0 (#243)
          cp packaging/linux/install-server.sh packaging/linux/install.sh release/
          cp packaging/windows/install-windows-server.ps1 release/      # 2.0.0 (#187): Windows server installer
          printf '{"version":"%s","branch":"%s","commit":"%s","run":"%s","built_at":"%s"}\n' \
            "$VERSION" "$GITHUB_REF_NAME" "$GITHUB_SHA" "$GITHUB_RUN_NUMBER" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > release/build-info.json
      - name: Smoke test the Linux package
        run: |
          mkdir -p "$RUNNER_TEMP/pkg" && tar -xzf release/PennyWarden-linux-x64-portable.tar.gz -C "$RUNNER_TEMP/pkg"
          BIN=$(find "$RUNNER_TEMP/pkg" -maxdepth 2 -name pennywarden -type f | head -1)
          env -i HOME="$RUNNER_TEMP" PATH=/usr/bin:/bin "$BIN" --no-browser --port 8790 --data-dir "$RUNNER_TEMP/d" &
          for i in $(seq 1 60); do curl -fs http://127.0.0.1:8790/api/health >/dev/null && break; sleep 1; done
          STATUS=$(curl -fs http://127.0.0.1:8790/api/system/status); echo "$STATUS"
          [[ "$STATUS" == *"\"version\":\"$(bash scripts/version.sh)\""* ]] || { echo "::error::package reports the wrong version"; exit 1; }
      - uses: actions/upload-artifact@v7
        with:
          name: linux-packages-${{ github.run_number }}
          path: release/
          retention-days: 1

  windows-exe:
    # v1.5.0 CR-026: one-file .exe (PyInstaller --onefile) + smoke test of the .exe and of the portable zip.
    needs: package
    if: ${{ !failure() && !cancelled() }}
    runs-on: windows-latest
    timeout-minutes: 40
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Build info shown in the app
        env:
          VERSION: ${{ needs.package.outputs.version }}
        run: |
          $sha = "$env:GITHUB_SHA".Substring(0, 7)
          $built = (Get-Date).ToUniversalTime().ToString("yyyy-MM-ddTHH:mm:ssZ")
          '{"version":"' + $env:VERSION + '","branch":"' + $env:GITHUB_REF_NAME + '","commit":"' + $sha + '","run":"' + $env:GITHUB_RUN_NUMBER + '","built_at":"' + $built + '"}' |
            Set-Content -Encoding utf8NoBOM backend/fmpoc/build_info.json
      - name: Frontend production build
        run: |
          npm --prefix frontend ci
          npm --prefix frontend run build
      - name: One-file .exe
        env:
          FM_EXE_NAME: PennyWarden-${{ needs.package.outputs.version }}-windows-x64
        run: |
          python -m pip install --quiet -r backend/requirements.txt pyinstaller==6.22.3
          python -m PyInstaller --noconfirm --log-level WARN --distpath dist --workpath build/pyinstaller-onefile packaging/pyinstaller/fmpoc-onefile.spec
          Get-Item "dist/$env:FM_EXE_NAME.exe" | Format-List Name, Length
      - uses: actions/download-artifact@v8
        with:
          name: linux-packages-${{ github.run_number }}
          path: release
      - name: Smoke test the .exe
        run: pwsh packaging/windows/smoke_test.ps1 -Command "dist/PennyWarden-${{ needs.package.outputs.version }}-windows-x64.exe" -Version "${{ needs.package.outputs.version }}" -Port 8791
      - name: Smoke test the portable zip
        run: |
          Expand-Archive release/PennyWarden-windows-x64.zip -DestinationPath "$env:RUNNER_TEMP/zip"
          pwsh packaging/windows/smoke_test.ps1 -Command "$env:RUNNER_TEMP/zip/PennyWarden-windows-x64/PennyWarden.cmd" -Version "${{ needs.package.outputs.version }}" -Port 8792
      - name: NSSM for the Windows server installer (#187)
        # NSSM 2.24 (public domain) is attached to the release so install-windows-server.ps1 can check it against
        # SHA256SUMS.txt. nssm.cc publishes no SHA-256; this is the SHA-1 published in the Chocolatey package.
        run: |
          # nssm.cc is often slow or down: the same file from the Internet Archive is the fallback. The SHA-1 decides,
          # whichever source answered.
          $zip = "$env:RUNNER_TEMP/nssm-2.24.zip"
          $sources = @("https://nssm.cc/release/nssm-2.24.zip",
                       "https://web.archive.org/web/2023id_/https://nssm.cc/release/nssm-2.24.zip",
                       "https://nssm.cc/release/nssm-2.24.zip")
          $ok = $false
          foreach ($u in $sources) {
            for ($i = 1; $i -le 3 -and -not $ok; $i++) {
              try {
                Invoke-WebRequest $u -OutFile $zip -UseBasicParsing -TimeoutSec 60
                $sha1 = (Get-FileHash $zip -Algorithm SHA1).Hash.ToLowerInvariant()
                if ($sha1 -eq "be7b3577c6e3a280e5106a9e9db5b3775931cefc") { $ok = $true; Write-Host "nssm-2.24.zip from $u" }
                else { Write-Host "::warning::nssm-2.24.zip from $u has SHA-1 $sha1 - ignored" }
              } catch { Write-Host "::warning::$u : $($_.Exception.Message)"; Start-Sleep -Seconds (10 * $i) }
            }
            if ($ok) { break }
          }
          if (-not $ok) { throw "could not get nssm-2.24.zip with the expected SHA-1 from any source" }
          Expand-Archive $zip -DestinationPath "$env:RUNNER_TEMP/nssm"
          Copy-Item "$env:RUNNER_TEMP/nssm/nssm-2.24/win64/nssm.exe" dist/nssm.exe
          (Get-FileHash dist/nssm.exe).Hash
      - name: Test the Windows server installer (#187)
        run: pwsh packaging/windows/test_server_installer.ps1 -Zip release/PennyWarden-windows-x64.zip -Nssm dist/nssm.exe -Version "${{ needs.package.outputs.version }}"
      - uses: actions/upload-artifact@v7
        with:
          name: windows-exe-${{ github.run_number }}
          path: |
            dist/PennyWarden-${{ needs.package.outputs.version }}-windows-x64.exe
            dist/nssm.exe
          retention-days: 1

  macos-app:
    # 1.6.7: PennyWarden.app (PyInstaller app bundle, arm64, ad hoc signed) in a .dmg + smoke tests.
    needs: package
    if: ${{ !failure() && !cancelled() }}
    runs-on: macos-15          # Apple Silicon (arm64) runner
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Build info shown in the app
        env:
          VERSION: ${{ needs.package.outputs.version }}
        run: |
          printf '{"version":"%s","branch":"%s","commit":"%s","run":"%s","built_at":"%s"}\n' \
            "$VERSION" "$GITHUB_REF_NAME" "${GITHUB_SHA::7}" "$GITHUB_RUN_NUMBER" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            > backend/fmpoc/build_info.json
      - name: Frontend production build
        run: npm --prefix frontend ci && npm --prefix frontend run build
      - name: PennyWarden.app and .dmg
        env:
          FM_PYTHON: python
        run: |
          [ "$(uname -m)" = "arm64" ] || { echo "::error::this runner is not Apple Silicon"; exit 1; }
          bash packaging/build_macos.sh
          ls -l dist/*.dmg
      - name: Smoke test the app (as started by a double-click)
        run: bash packaging/macos/smoke_test.sh dist/PennyWarden.app "${{ needs.package.outputs.version }}" 8793 window
      - name: Smoke test the app from the disk image (no window)
        run: bash packaging/macos/smoke_test.sh "dist/PennyWarden-${{ needs.package.outputs.version }}-macos-arm64.dmg" "${{ needs.package.outputs.version }}" 8794 headless
      - uses: actions/upload-artifact@v7
        with:
          name: macos-app-${{ github.run_number }}
          path: dist/PennyWarden-${{ needs.package.outputs.version }}-macos-arm64.dmg
          retention-days: 1

  assemble:
    # All release files + SHA256SUMS.txt (install.sh verifies against it). Publishing waits for all smoke tests.
    needs: [package, windows-exe, macos-app]
    if: ${{ !failure() && !cancelled() }}
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: linux-packages-${{ github.run_number }}
          path: release
      - uses: actions/download-artifact@v8
        with:
          name: windows-exe-${{ github.run_number }}
          path: release
      - uses: actions/download-artifact@v8
        with:
          name: macos-app-${{ github.run_number }}
          path: release
      - name: Checksums
        run: (cd release && sha256sum -- * > SHA256SUMS.txt && cat SHA256SUMS.txt)
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ needs.package.outputs.artifact }}
          path: release/
          # test/main packages are kept permanently on the GitHub release; the run copy only feeds the publish job.
          # Short retention keeps Actions artifact storage (1 GB on GitHub Pro) well below the limit.
          retention-days: ${{ github.ref_name == 'develop' && 7 || 1 }}

  publish:
    needs: [package, assemble]
    if: ${{ !failure() && !cancelled() && (github.ref_name == 'test' || github.ref_name == 'main') }}
    runs-on: ubuntu-26.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v8
        with:
          name: ${{ needs.package.outputs.artifact }}
          path: release
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.package.outputs.version }}
        run: |
          bash scripts/release_notes.sh "$VERSION" > changes.md
          if [ "$GITHUB_REF_NAME" = "test" ]; then
            if git rev-parse -q --verify "refs/tags/v$VERSION" >/dev/null; then
              echo "::notice::v$VERSION is already released - no test pre-release created (bump the version on develop)."
              exit 0
            fi
            TAG="v$VERSION-test.$GITHUB_RUN_NUMBER"
            # 2.0.0 (#207): the install block first - the notes of a test build carry the whole unreleased section
            { printf 'Test build from branch `test` (commit %s). Install or upgrade on the **test** server:\n```\ncurl -fsSL https://github.com/%s/releases/download/%s/install.sh | sudo bash -s -- --version %s\n```\nWindows: download `PennyWarden-%s-windows-x64.exe` and double-click it.\nWindows server: download `install-windows-server.ps1`, then in PowerShell as Administrator: `powershell -ExecutionPolicy Bypass -File .\\install-windows-server.ps1 -Version %s` (docs/install-windows-server.md).\nMac (Apple Silicon): download `PennyWarden-%s-macos-arm64.dmg`, drag PennyWarden to Applications and see *Read me first* in the disk image for the first start.\n\n---\n\n' "$GITHUB_SHA" "$GITHUB_REPOSITORY" "$TAG" "$TAG" "$VERSION" "$TAG" "$VERSION"
              cat changes.md; } > notes.md
            gh release create "$TAG" release/* --target "$GITHUB_SHA" --prerelease \
              --title "PennyWarden $VERSION (test build $GITHUB_RUN_NUMBER)" --notes-file notes.md
          else
            TAG="v$VERSION"
            if git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
              echo "::notice::$TAG already released - packages are attached to this workflow run only."
              exit 0
            fi
            cp changes.md notes.md
            printf '\n---\nProduction release (commit %s). Install or upgrade (see docs/upgrade.md):\n```\ncurl -fsSL https://github.com/%s/releases/latest/download/install.sh | sudo bash\n```\nWindows: download `PennyWarden-%s-windows-x64.exe` and double-click it.\nWindows server: download `install-windows-server.ps1` and run it in PowerShell as Administrator (docs/install-windows-server.md).\nMac (Apple Silicon): download `PennyWarden-%s-macos-arm64.dmg`, drag PennyWarden to Applications and see *Read me first* in the disk image for the first start.\n' "$GITHUB_SHA" "$GITHUB_REPOSITORY" "$VERSION" "$VERSION" >> notes.md
            gh release create "$TAG" release/* --target "$GITHUB_SHA" --latest \
              --title "PennyWarden $VERSION" --notes-file notes.md
          fi
      # 2.1.0 (#329): keep the test builds tidy - while testing, the newest 3 of this version; at the production
      # release, none of this version (other versions and production releases are never touched). Runs after the
      # release is published and before the pages refresh (the site job), and can never fail the build.
      - name: Remove old test builds
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.package.outputs.version }}
        run: |
          if [ "$GITHUB_REF_NAME" = "main" ]; then
            if gh api "repos/$GITHUB_REPOSITORY/releases/tags/v$VERSION" --jq .tag_name >/dev/null 2>&1; then
              bash scripts/prune_test_builds.sh "$VERSION" release
            else
              echo "::warning::v$VERSION is not published - its test builds were kept."
            fi
          else
            bash scripts/prune_test_builds.sh "$VERSION" test 3
          fi

  # 1.10.0 (#83 / #58): refresh pennywarden.org - the release data files list the new release (production) or test
  # build (test channel). Started on main, so the live page is always the released one.
  site:
    needs: publish
    if: ${{ !failure() && !cancelled() && (github.ref_name == 'test' || github.ref_name == 'main') }}
    runs-on: ubuntu-26.04
    permissions:
      actions: write
    steps:
      - name: Start the pages workflow
        env:
          GH_TOKEN: ${{ github.token }}
        # before the first release that contains pages.yml, main does not have the workflow yet: warn, do not fail
        run: |
          gh workflow run pages.yml --repo "$GITHUB_REPOSITORY" --ref main \
            || echo "::warning::pennywarden.org was not refreshed (is pages.yml on main yet?). Run the pages workflow by hand."
