# Reusable: the full verification suite (backend + security tests, typecheck/build, E2E, dependency audits).
# Called by ci.yml (pull requests, feature branches) and build.yml (develop / test / main).
name: tests
on:
  workflow_call:
    inputs:
      notices:
        # 1.8.0 (#98): "check" fails when THIRD-PARTY-NOTICES.txt is out of date (pull requests into test and main,
        # test and main builds); "regenerate" rewrites it for the run and reports the difference, so Dependabot pull
        # requests and develop builds still run the tests. The file is then regenerated on develop by hand.
        type: string
        default: check

permissions:
  contents: read

jobs:
  test:
    name: test
    runs-on: ubuntu-26.04
    timeout-minutes: 75   # 2.4.0: the backend suite alone is ~35-40 min on the hosted runner
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: |
          pip install -r backend/requirements-dev.txt
          npm --prefix frontend ci
      - name: Version consistency (backend config.py = frontend package.json)
        run: bash scripts/version.sh --check
      - name: Third-party notices (v1.5.0 - every shipped dependency listed with its license; 1.8.0 #98)
        env:
          NOTICES: ${{ inputs.notices }}
        run: |
          if [ "$NOTICES" = "regenerate" ]; then
            python scripts/third_party_notices.py --regenerate
          else
            python scripts/third_party_notices.py --check
          fi
      - name: Backend tests (AC-mapped, incl. security negative tests)
        run: cd backend && python -m pytest -p no:warnings
      - name: Frontend typecheck + production build
        run: cd frontend && npx tsc --noEmit -p . && npm run build
      - name: E2E UI tests (Playwright)
        run: |
          cd frontend
          npx playwright install --with-deps chromium
          FM_PYTHON=python npx playwright test
      - name: Dependency vulnerability checks (AC-SEC-024)
        run: bash scripts/security_check.sh
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: test-reports-${{ github.run_id }}
          path: |
            build/security
            frontend/e2e-screenshots
            frontend/test-results
            THIRD-PARTY-NOTICES.txt
          if-no-files-found: ignore
          retention-days: 7
